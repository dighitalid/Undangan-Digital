<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Digital App by Dighital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Titan+One&family=Noto+Sans:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--ink:#eaf3ff;--mut:#9db8de;--pri:#4dd8ff;--pri2:#2f7de1;--line:rgba(255,255,255,.17);--glass:rgba(10,36,88,.58);--gold:#f6c34a;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:14px}
body{margin:0;color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(900px 480px at 50% -10%,rgba(190,226,255,.6),rgba(110,175,255,.18) 50%,transparent 72%),linear-gradient(180deg,#1a5cc0 0%,#0c3680 42%,#061a42 100%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
body::before{width:420px;height:420px;left:-140px;top:28%;background:rgba(77,216,255,.26)}
body::after{width:520px;height:520px;right:-170px;bottom:-140px;background:rgba(90,120,255,.34);animation-delay:-7s}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(7,28,72,.72),rgba(7,28,72,.4));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--line)}
.logo{display:flex;padding:0 4px 16px}.logo small{color:var(--mut);font-size:.72rem}
.lgc{background:#fff;border-radius:14px;padding:6px 10px;display:inline-block;box-shadow:0 8px 20px rgba(0,10,50,.25)}
.logo img{width:100%;max-width:170px;display:block}.hl{height:28px;vertical-align:middle;margin:0 2px;display:inline-block}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;cursor:pointer;text-align:left;width:100%;transition:.25s}
.nav:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(3px)}
.nav.on{color:#fff;background:linear-gradient(90deg,rgba(77,216,255,.28),rgba(77,216,255,.05));box-shadow:inset 0 0 0 1px rgba(77,216,255,.45),0 0 26px rgba(77,216,255,.18)}
.main{position:relative;padding:22px;max-width:1180px;width:100%;margin:0 auto;display:grid;gap:18px}
/* hero + Byte */
.hero{position:relative;overflow:hidden;border-radius:34px;padding:26px 28px;min-height:270px;display:grid;grid-template-columns:1fr 290px;align-items:center;gap:10px;
 background:radial-gradient(420px 280px at 82% 45%,rgba(77,216,255,.38),transparent 70%),radial-gradient(300px 200px at 10% 0%,rgba(255,255,255,.18),transparent 70%),linear-gradient(135deg,rgba(18,64,146,.9),rgba(6,26,70,.92));
 border:1px solid var(--line);box-shadow:0 26px 60px rgba(0,12,50,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.hero h1{margin:10px 0 12px;font-size:2.1rem;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#fff,#8fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.85rem;font-weight:600}
.bubble{position:relative;background:#fff;color:#102c5a;border-radius:20px;padding:13px 18px;font-weight:700;font-size:.93rem;max-width:400px;min-height:52px;box-shadow:0 12px 30px rgba(0,10,50,.3);margin:0 0 16px}
.bubble::after{content:"";position:absolute;right:-8px;top:50%;width:18px;height:18px;background:#fff;border-radius:4px;transform:translateY(-50%) rotate(45deg)}
.bubble.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.byte-wrap{position:relative;display:grid;place-items:center;min-height:250px}
.byte-wrap.jump{animation:jump .8s cubic-bezier(.3,1.5,.5,1)}
.orbit{position:absolute;width:250px;height:250px;border-radius:50%;border:2px dashed rgba(124,230,255,.45);animation:spin 20s linear infinite}
.orbit.o2{width:195px;height:195px;border:2px dotted rgba(255,255,255,.35);animation-direction:reverse;animation-duration:14s}
.spk{position:absolute;color:#bff3ff;font-size:18px;animation:twinkle 2.4s ease-in-out infinite;text-shadow:0 0 10px #4dd8ff}
.spk.s1{left:6%;top:14%}.spk.s2{right:4%;top:22%;animation-delay:.8s;font-size:14px}.spk.s3{right:14%;bottom:10%;animation-delay:1.5s}.spk.s4{left:12%;bottom:16%;animation-delay:.3s;font-size:12px}
#byte{position:relative;width:270px;max-width:100%;overflow:visible;filter:drop-shadow(0 18px 22px rgba(0,16,70,.5))}
.by-float{animation:float 3.4s ease-in-out infinite}
.by-shadow{transform-origin:150px 330px;animation:shad 3.4s ease-in-out infinite}
.by-flame{transform-origin:150px 258px;animation:flame .5s ease-in-out infinite alternate}
.by-head{transform-origin:150px 200px;animation:tilt 5s ease-in-out infinite}
.by-ant{animation:bob 1.5s ease-in-out infinite alternate}.by-ant.b{animation-delay:-.7s}
.by-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.by-arm-r{transform-origin:192px 222px;animation:wave 1.1s ease-in-out infinite}
.by-arm-l{transform-origin:108px 222px;animation:thumb 2.2s ease-in-out infinite}
/* kartu kaca */
.card{position:relative;background:linear-gradient(160deg,rgba(40,100,190,.38),rgba(8,32,80,.66));backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 22px 50px rgba(0,10,45,.38),inset 0 1px 0 rgba(255,255,255,.24)}
.card h2{display:flex;align-items:center;gap:10px;font-size:1.08rem;margin:0 0 14px;font-weight:800}
.card h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri);box-shadow:0 0 14px var(--pri)}
.hero,.card{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
.main>*:nth-child(2){animation-delay:.1s}.main>*:nth-child(3){animation-delay:.2s}
.cols>div>.card:nth-child(2){animation-delay:.12s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;color:#fff;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:linear-gradient(135deg,#2f7de1,#1fb8ff);box-shadow:0 10px 24px rgba(31,150,255,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 14px 30px rgba(31,150,255,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.w{width:100%}
.btn.g{background:rgba(255,255,255,.12);color:#dff3ff;box-shadow:inset 0 0 0 1px var(--line)}
.btn.g:hover{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
#dl{background:linear-gradient(135deg,#ffd76e,#f5a21f);color:#4a2c00;box-shadow:0 10px 26px rgba(245,162,31,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;padding:13px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font:inherit;color:var(--ink);text-align:left;background:rgba(255,255,255,.07);transition:.25s}
.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
.tile.on{border-color:var(--pri);background:rgba(77,216,255,.14);box-shadow:0 0 0 1px var(--pri),0 0 30px rgba(77,216,255,.3)}
.tile i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.tile b{display:block;font-size:.9rem;line-height:1.2}.tile small{color:var(--mut);font-size:.72rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 15px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;background:rgba(255,255,255,.08);color:#dcecff;transition:.2s}
.chip:hover{background:rgba(255,255,255,.17)}
.chip.on{background:linear-gradient(135deg,#2f7de1,#1fb8ff);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(31,150,255,.45)}
.cols{display:grid;gap:18px}
@media(min-width:1000px){.cols{grid-template-columns:1fr 470px;align-items:start}.prev{position:sticky;top:16px}}
label{display:block;font-size:.78rem;color:var(--mut);margin:12px 0 4px;font-weight:700;letter-spacing:.02em}
input,textarea{width:100%;font:inherit;color:#fff;background:rgba(3,16,46,.5);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:.2s}
input::placeholder,textarea::placeholder{color:rgba(190,210,240,.45)}
input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(77,216,255,.22)}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.det{margin-top:12px;padding:10px 14px;border-radius:14px;background:rgba(77,216,255,.1);border:1px solid rgba(77,216,255,.25);font-size:.85rem}
.fl{display:block;text-align:center;border:2px dashed rgba(255,255,255,.28);border-radius:16px;padding:14px;cursor:pointer;font-weight:700;color:var(--pri);transition:.2s}.fl:hover{background:rgba(77,216,255,.1);border-color:var(--pri)}.fl input{display:none}
canvas{width:100%;height:auto;display:block;border-radius:18px;background:#0a2a60;box-shadow:0 16px 40px rgba(0,10,45,.5)}
.out{margin-top:10px;font-size:.85rem;color:var(--mut);white-space:pre-wrap}
.hint{font-size:.78rem;color:var(--mut);margin:10px 0 0}.hint b{color:#dff3ff}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--pri);height:28px;box-shadow:none}
#cv{cursor:default;touch-action:pan-y}
#cw{position:relative}
#sel{position:absolute;border:2px dashed var(--pri);border-radius:8px;pointer-events:none;z-index:4;background:rgba(77,216,255,.1);box-shadow:0 0 18px rgba(77,216,255,.5)}
#ed{position:absolute;z-index:6;margin:0;padding:0;border:0;outline:2px dashed var(--pri);outline-offset:8px;background:rgba(255,255,255,.12);border-radius:4px;caret-color:#111827;min-width:24px;min-height:1em;word-break:normal;box-shadow:none}
#tb .chip{padding:7px 12px}
textarea.ln{min-height:46px;resize:none;overflow:hidden;line-height:1.35}
/* toast Byte */
.bt{position:fixed;right:18px;bottom:22px;z-index:50;display:flex;align-items:center;gap:10px;max-width:320px;background:#fff;color:#102c5a;border-radius:20px;padding:8px 16px 8px 10px;font-weight:700;font-size:.85rem;box-shadow:0 16px 40px rgba(0,10,50,.45);transform:translateY(140%);opacity:0;transition:.45s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
.bt.on{transform:none;opacity:1}.bt svg{width:44px;height:38px;flex:none;animation:bob 1s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.8);opacity:.55}}
@keyframes flame{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}
@keyframes tilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
@keyframes thumb{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,-50px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:none;opacity:1}}
@keyframes jump{0%{transform:none}35%{transform:translateY(-30px) scale(1.06,.96)}60%{transform:translateY(0) scale(.96,1.05)}100%{transform:none}}
@media(max-width:859px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px;gap:4px;border-radius:28px;border:1px solid var(--line);background:rgba(6,26,68,.8);box-shadow:0 18px 40px rgba(0,8,40,.55)}
 .logo{display:none}
 .nav{flex-direction:column;gap:2px;font-size:.68rem;padding:8px 4px;text-align:center;width:auto;flex:1;justify-content:center;border-radius:20px}
 .nav:hover{transform:none}
 .nav.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--pri);box-shadow:0 0 8px var(--pri)}
 .main{padding:14px 14px 110px}
 .hero{grid-template-columns:1fr;padding:18px;text-align:center;min-height:0}
 .byte-wrap{order:-1;min-height:215px}#byte{width:210px}.orbit{width:210px;height:210px}.orbit.o2{width:160px;height:160px}
 .hero h1{font-size:1.65rem}.hero .sub{justify-content:center}
 .bubble{margin:0 auto 14px;text-align:center}
 .bubble::after{right:auto;left:50%;top:-8px;transform:translateX(-50%) rotate(45deg)}
 .bt{right:12px;bottom:96px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* drag & drop foto */
#dz{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(6,26,66,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#dz.on{display:flex}
#dz div{border:3px dashed var(--pri);border-radius:32px;padding:44px 52px;text-align:center;font-weight:800;font-size:1.25rem;color:#fff;background:rgba(77,216,255,.12);box-shadow:0 0 60px rgba(77,216,255,.35);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
#dz small{display:block;margin-top:8px;font-weight:600;font-size:.85rem;color:var(--mut)}
#cw.dzhot canvas{outline:3px dashed var(--pri);outline-offset:-3px}

/* ===== TEMA BARU: playful blue (terinspirasi Collaboo) ===== */
:root{--ink:#14316b;--mut:#5c77a6;--pri:#2a58b0;--pri2:#1b3f84;--line:rgba(20,49,107,.13);--glass:#f1f4fa;--blue:#2a58b0;--deep:#1b3f84;--paper:#f1f4fa;--pastel:#bcd9f6;--pastel2:#dbeafb;--pink:#ff5fa8;--sun:#ffd23f;--mint:#4ccdc0;--lime:#c7e22e;--grape:#b58de0;color-scheme:light}
body{color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;background-color:#2356ab;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.6px),linear-gradient(180deg,#2a62bd 0%,#2356ab 50%,#1d4a96 100%);background-size:28px 28px,100% 100%;background-attachment:fixed}
body::before{background:rgba(120,180,255,.3)}body::after{background:rgba(255,95,168,.16)}
h1,h2,.nav,.btn,.chip,.tile b,.bubble,.bt{font-family:"Fredoka","Plus Jakarta Sans",system-ui,sans-serif}
.side{background:transparent;border-right:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.logo small{color:#cfe0ff}
.lgc{border-radius:20px;box-shadow:0 6px 0 rgba(10,35,90,.35)}
.nav{color:#dbe9ff;font-weight:600;font-size:1rem;border-radius:22px;overflow:hidden}
.nav:hover{background:rgba(255,255,255,.16);color:#fff}
.nav.on{color:var(--blue);background:var(--paper);box-shadow:0 5px 0 rgba(10,35,90,.35)}
.hero{background:var(--paper);border:0;border-radius:36px;box-shadow:0 10px 0 rgba(10,35,90,.35),0 30px 50px rgba(0,15,60,.25);color:var(--ink)}
.hero h1{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--blue);letter-spacing:0}
.hero h1 span{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--pink)}
.hero .sub{color:var(--mut)}
.bubble{background:var(--pastel);color:var(--deep);box-shadow:none;font-weight:600}
.bubble::after{background:var(--pastel)}
.byte-wrap::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:var(--pastel);box-shadow:inset 0 -14px 0 rgba(42,88,176,.12)}
.orbit{border-color:rgba(42,88,176,.35)}.orbit.o2{border-color:rgba(255,95,168,.45)}
.spk{color:var(--sun);text-shadow:0 0 8px rgba(255,210,63,.8)}
#byte{filter:drop-shadow(0 14px 14px rgba(20,49,107,.35))}
.card{background:var(--paper);color:var(--ink);border:0;border-radius:32px;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 0 rgba(10,35,90,.3),0 26px 44px rgba(0,15,60,.22)}
.card h2{font-family:"Fredoka",sans-serif;font-size:1.25rem;font-weight:700;color:var(--blue)}
.card h2::before{width:16px;height:16px;background:var(--pink);box-shadow:none;border:3px solid var(--sun)}
.btn{position:relative;overflow:hidden;color:#fff;background:var(--blue);box-shadow:0 6px 0 var(--deep);font-size:1rem;font-weight:600;padding:12px 26px;transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 0 var(--deep)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--deep)}
.btn.g{background:var(--pastel);color:#1e4a98;box-shadow:0 6px 0 #8fb9e6}
.btn.g:hover{background:#c9e0f7;box-shadow:0 8px 0 #8fb9e6}.btn.g:active{box-shadow:0 1px 0 #8fb9e6}
#dl{background:var(--sun);color:#4a2c00;box-shadow:0 6px 0 #d9a514;font-size:1.05rem}
#dl:hover{box-shadow:0 8px 0 #d9a514}#dl:active{box-shadow:0 1px 0 #d9a514}
.tile{position:relative;overflow:hidden;background:#fff;border:2px solid #dbe6f6;color:var(--ink);border-radius:22px}
.tile:hover{background:var(--pastel2);transform:translateY(-3px) rotate(-.6deg)}
.tile.on{background:var(--pastel2);border-color:var(--blue);box-shadow:0 5px 0 var(--blue)}
.tile i{box-shadow:0 4px 0 rgba(20,49,107,.2)}
.tile small{color:var(--mut)}
.chip{position:relative;overflow:hidden;border:0;background:var(--pastel);color:#1e4a98;font-weight:600}
.chip:hover{background:#a9cdf2;transform:translateY(-1px)}
.chip.on{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--deep)}
label{color:var(--mut)}
input,textarea{color:var(--ink);background:#cfe3f8;border:2px solid transparent;border-radius:18px}
input::placeholder,textarea::placeholder{color:rgba(20,49,107,.42)}
input:focus,textarea:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,88,176,.18)}
input[type=range]{background:none;accent-color:var(--blue)}
:focus-visible{outline-color:var(--pink)}
.det{background:var(--pastel2);border:0;border-radius:18px;color:var(--ink)}
.fl{position:relative;overflow:hidden;border:3px dashed var(--blue);background:var(--pastel2);color:var(--blue);border-radius:22px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.02rem}
.fl:hover{background:var(--pastel);border-color:var(--pink)}
canvas{background:#e3ecf8;border-radius:22px;box-shadow:0 8px 0 rgba(20,49,107,.18),0 18px 30px rgba(0,15,60,.22)}
.out{color:var(--mut)}.hint{color:var(--mut)}.hint b{color:var(--deep)}
#sel{border-color:var(--pink);background:rgba(255,95,168,.1);box-shadow:0 0 14px rgba(255,95,168,.45)}
#ed{outline-color:var(--pink)}
#dz{background:rgba(27,63,132,.8)}
#dz div{background:var(--paper);color:var(--blue);border:4px dashed var(--pink);font-family:"Fredoka",sans-serif;box-shadow:0 10px 0 rgba(10,35,90,.4)}
#dz small{color:var(--mut)}
#cw.dzhot canvas{outline:4px dashed var(--pink)}
.bt{display:none!important}
/* maskot-maskot kecil */
.squad{display:inline-flex;gap:4px;margin-top:14px;padding:8px 12px 4px;border-radius:26px;background:var(--blue);box-shadow:0 5px 0 var(--deep)}
.squad svg{width:50px;height:50px;cursor:pointer;overflow:visible;animation:mbob 2.6s ease-in-out infinite;transition:transform .2s;-webkit-tap-highlight-color:transparent}
.squad svg:nth-child(2){animation-delay:-.5s}.squad svg:nth-child(3){animation-delay:-1s}.squad svg:nth-child(4){animation-delay:-1.5s}.squad svg:nth-child(5){animation-delay:-2s}
.squad svg:hover{transform:scale(1.18) rotate(-6deg)}
.squad svg.hop{animation:mhop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mhop{0%{transform:none}35%{transform:translateY(-22px) scale(1.12,.92)}65%{transform:translateY(0) scale(.94,1.08)}100%{transform:none}}
/* efek interaksi */
.fxt-wrap{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:10001;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.fxt{display:flex;align-items:center;gap:10px;max-width:min(92vw,460px);background:#fff;color:var(--deep);font-family:"Fredoka",sans-serif;font-weight:600;font-size:.98rem;line-height:1.25;padding:10px 20px 10px 12px;border-radius:999px;box-shadow:0 5px 0 rgba(10,35,90,.35),0 18px 30px rgba(0,15,60,.3);animation:tin .55s cubic-bezier(.2,1.5,.4,1) both}
.fxt .e{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;background:var(--pastel)}
.fxt.ok .e{background:#bff0e9}.fxt.err .e{background:#ffd0e5}.fxt.err{animation:tin .55s cubic-bezier(.2,1.5,.4,1) both,shk .5s .3s}
.fxt.out{animation:tout .3s ease-in forwards}
@keyframes tin{from{transform:translateY(-70px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-40px) scale(.85);opacity:0}}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shk .5s}
.fxc{position:fixed;left:50%;top:50%;z-index:10002;width:min(88vw,360px);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;text-align:center;background:var(--paper);border-radius:36px;padding:22px 22px 24px;box-shadow:0 10px 0 var(--deep),0 40px 70px rgba(0,10,50,.5);transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.fxc.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.fxc .mon{width:104px;height:104px;margin:-62px auto 4px;display:block;overflow:visible;filter:drop-shadow(0 8px 0 rgba(20,49,107,.2));animation:mhop 1.2s .15s both,mbob 2.2s 1.2s ease-in-out infinite}
.fxc b{display:block;font-family:"Fredoka",sans-serif;font-size:1.9rem;line-height:1.1;font-weight:700;color:var(--blue)}
.fxc span{display:block;margin-top:8px;font-family:"Fredoka",sans-serif;font-weight:500;font-size:1.05rem;color:var(--ink)}
.fxcv{position:fixed;inset:0;width:100%;height:100%;z-index:10003;pointer-events:none;background:transparent;box-shadow:none;border-radius:0}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.chip .rp,.tile .rp,.fl .rp,.btn.g .rp{background:rgba(42,88,176,.25)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.cvpop{animation:cvp .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes cvp{0%{transform:scale(.96)}45%{transform:scale(1.02)}100%{transform:none}}
.hop{animation:chop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes chop{0%{transform:none}35%{transform:translateY(-12px) scale(1.012)}100%{transform:none}}
@media(max-width:859px){
 .side{background:var(--deep);border:0;border-radius:32px;box-shadow:0 6px 0 rgba(8,28,70,.6),0 20px 36px rgba(0,8,40,.45);padding:8px 10px}
 .nav{color:#cfe0ff;font-size:.72rem;border-radius:24px}
 .nav.on{background:var(--paper);color:var(--blue);box-shadow:none}
 .nav.on::after{background:var(--pink);box-shadow:none}
 .hero{text-align:center}.squad{margin-left:auto;margin-right:auto}
 .byte-wrap::before{width:190px;height:190px}
 .fxt-wrap{top:calc(8px + env(safe-area-inset-top,0px))}
}

/* ===== TAB BAR, PULL-TO-REFRESH, SHARE WA ===== */
#tabbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:grid;grid-template-columns:repeat(4,1fr);width:min(94vw,440px);padding:6px;border-radius:30px;background:var(--deep);box-shadow:0 6px 0 rgba(8,28,70,.6),0 20px 36px rgba(0,8,40,.45);animation:tbin .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tbin{from{transform:translate(-50%,160%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#tbpill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:24px;background:var(--paper);box-shadow:0 4px 0 rgba(10,35,90,.35);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.tb-t{position:relative;z-index:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px 8px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.74rem;white-space:nowrap;color:#cfe0ff;transition:color .3s,transform .15s;-webkit-tap-highlight-color:transparent}
.tb-t:active{transform:scale(.9)}
.tb-t.on{color:var(--blue)}
.tb-t.tb-wa.on{color:#1f9d55}
.tb-i{font-size:1.2rem;line-height:1.1;display:inline-block;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.tb-t.on .tb-i{transform:translateY(-3px) scale(1.15)}
.tb-t.bump .tb-i{animation:mhop .6s cubic-bezier(.3,1.5,.5,1)}
#ptr{position:fixed;left:50%;top:12px;z-index:45;padding:9px 18px;border-radius:22px;background:var(--paper);color:var(--blue);font-family:"Fredoka",sans-serif;font-weight:600;font-size:.9rem;box-shadow:0 5px 0 rgba(10,35,90,.35);opacity:0;transform:translate(-50%,-70px);pointer-events:none;white-space:nowrap}
#ptr[data-r="1"]{color:#fff;background:var(--pink)}
#cschips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
#csnum{margin:6px 0 0}
#walk{margin-top:10px}
#pastebtn{margin-top:12px}
@media(max-width:859px){.side{display:none!important}.main{padding-bottom:120px}}
@media(prefers-reduced-motion:reduce){#tabbar,.tb-i,#tbpill{transition:none!important;animation:none!important}}
#rlist{display:grid;gap:12px}
.ritem{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px;border-radius:18px;background:#f4f7ff;box-shadow:0 4px 0 #d8e3fb;animation:rvin .45s cubic-bezier(.2,1.2,.4,1) both}
.ritem img{width:72px;height:72px;object-fit:cover;border-radius:14px;background:#fff}
.rinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.rinfo b{font-family:"Fredoka",sans-serif;font-size:1rem;color:#1d2b4f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rinfo small{color:#5b6b8f;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{grid-column:1/-1;display:flex;gap:8px}
.rbtn .btn{flex:1}
@keyframes rvin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
